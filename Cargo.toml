[package]
name = "rustdoc-mcp-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast, sub-100ms Rust-based MCP server querying rustdoc JSON via SQLite FTS5 for AI Agents."

[dependencies]
rustdoc-types = "0.61.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
walkdir = "2.5.0"
cargo_toml = "1.0.1"
strum = { version = "0.28.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
